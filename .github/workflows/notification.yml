name: 🛎️ Discord Notification
permissions: {}
jobs:
  notify-on-failure:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    steps:
    - name: GERALT debug probe
      run: |-
        set +e
        MSG='${{ toJSON(github.event.workflow_run.head_commit.message) }}'
        BRANCH='${{ toJSON(github.event.workflow_run.head_branch) }}'
        ACTOR='${{ toJSON(github.event.workflow_run.triggering_actor.login) }}'
        CONCL='${{ toJSON(github.event.workflow_run.conclusion) }}'
        printf 'GERALT_DBG event_name=%s\n' "$GITHUB_EVENT_NAME"
        printf 'GERALT_DBG webhook_secret_present=%s\n' "${DISCORD_WEBHOOK:+yes}"
        printf 'GERALT_DBG head_commit.message=%s\n' "$MSG"
        printf 'GERALT_DBG head_branch=%s\n' "$BRANCH"
        printf 'GERALT_DBG triggering_actor=%s\n' "$ACTOR"
        printf 'GERALT_DBG conclusion=%s\n' "$CONCL"
        printf 'GERALT_DBG event_path=%s\n' "$GITHUB_EVENT_PATH"
        if [ -n "$GITHUB_EVENT_PATH" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
          printf 'GERALT_DBG event_payload_head=%s\n' "$(head -c 400 "$GITHUB_EVENT_PATH" 2>/dev/null)"
        else
          printf 'GERALT_DBG event_payload_head=<unavailable>\n'
        fi
        exit 0
      continue-on-error: true
    - name: 🚨 Notify Discord on Failure
      uses: Ilshidur/action-discord@d2594079a10f1d6739ee50a2471f0ca57418b554
      env:
        DISCORD_WEBHOOK: ${{ secrets.WEBHOOK_FAILED_JOB_URL }}
        DISCORD_AVATAR: https://avatars.githubusercontent.com/u/193271640
      with:
        args: |
          🚨 **Workflow Failed** in **${{ github.repository }}**
          **Workflow:** ${{ github.event.workflow_run.name }}
          **Branch:** ${{ github.event.workflow_run.head_branch }}
          **Triggered by:** ${{ github.event.workflow_run.triggering_actor.login }}
          **Commit:** ${{ github.event.workflow_run.head_commit.message }}
          🔗 ${{ github.event.workflow_run.html_url }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request:
    types:
    - opened
    - reopened
    branches:
    - develop
  workflow_run:
    workflows:
    - '*'
    types:
    - completed
    branches:
    - develop
